name: CI

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install server dependencies
        run: python -m pip install -r server/requirements.txt

      - name: Test model training code
        run: python -m unittest discover model/training

      - name: Test server fallback
        run: python -m unittest discover server

      - name: Test Kotlin on-device runtime
        run: ./gradlew test
